[build-system]
requires = ["setuptools>=68", "wheel", "pybind11>=2.12"]
build-backend = "setuptools.build_meta"

[project]
name = "aquaforge"
version = "0.6.0"
description = "Procedural water normal map generator"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.7",
  "numpy>=1.26",
  "Pillow>=10.0",
  "opencv-python>=4.10",
  "PyOpenGL>=3.1.7"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "core*", "export*"]
exclude = ["cpp*", "tests*"]
